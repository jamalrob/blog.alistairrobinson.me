<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:site_name" content="Under an Aspect">
  <link rel="preload" href="/static/fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/barlow-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/atkinsonhyperlegiblenext-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/atkinsonhyperlegiblenext-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css?v={{ css_version }}">
  {% block head %}{% endblock %}
  <script>
    (function() {
      var saved = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body>
  <div class="container">
    <header class="header">
      <button class="toggle theme-toggle-btn" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
        <!-- shown in light mode (click to go dark) -->
        <svg class="icon-dark" width="21" height="21" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3 A9 9 0 0 1 12 21 Z" fill="currentColor" stroke="none"/>
        </svg>
        <!-- shown in dark mode (click to go light) -->
        <svg class="icon-light" width="21" height="21" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3 A9 9 0 0 0 12 21 Z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <a href="/" class="namelink"><span class="svgSize" style="width:1em; height:1em; margin-right:0.3em;">{{ logo_svg }}</span>Under an Aspect</a>
<a href="/about" class="navLink">About</a>
      <a href="/tags" class="navLink">Tags</a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu">
        <svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
    </header>
    <nav class="mobile-menu" id="mobile-menu" hidden>
      <a href="/about">About</a>
      <a href="/tags">Tags</a>
      <button class="theme-toggle-btn mobile-theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-dark" width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3 A9 9 0 0 1 12 21 Z" fill="currentColor" stroke="none"/>
        </svg>
        <svg class="icon-light" width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3 A9 9 0 0 0 12 21 Z" fill="currentColor" stroke="none"/>
        </svg>
        <span class="icon-dark">Dark mode</span>
        <span class="icon-light">Light mode</span>
      </button>
    </nav>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/theme.js?v={{ theme_js_version }}"></script>
  <script src="/static/lightbox.js?v={{ lightbox_js_version }}"></script>
</body>
</html>
