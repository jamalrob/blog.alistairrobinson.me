{% extends "base.html" %}

{% block head %}
<title>Tags &mdash; {{ site_title }}</title>
<link rel="canonical" href="{{ site_url }}/tags/">
<meta name="description" content="Browse all article tags on this site.">
<meta property="og:title"       content="Tags &mdash; Under an Aspect">
<meta property="og:image"       content="{{ og_image }}">
<meta property="og:url"         content="{{ site_url }}/tags/">
<meta property="og:type"        content="website">
<meta property="og:description" content="Browse all article tags on this site.">
<meta name="twitter:image"      content="{{ og_image }}">
{% endblock %}

{% block content %}
<section class="postArticle articleList innerContainer">
  <h1 class="heading2Xl">Tags</h1>
  <p>
    {% for tag in tags %}<a href="/tags/{{ tag }}">{{ tag }}</a><span class="lightText"> / </span>{% endfor %}
  </p>
</section>
{% endblock %}
